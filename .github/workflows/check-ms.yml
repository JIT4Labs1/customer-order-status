name: check-ms-graph
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Token + roles (no mail sent)
        env:
          T: ${{ secrets.MS_TENANT_ID }}
          C: ${{ secrets.MS_CLIENT_ID }}
          S: ${{ secrets.MS_CLIENT_SECRET }}
        run: |
          R=$(curl -s -X POST "https://login.microsoftonline.com/$T/oauth2/v2.0/token" -d "client_id=$C" --data-urlencode "client_secret=$S" -d "scope=https://graph.microsoft.com/.default" -d "grant_type=client_credentials")
          echo "$R" | python3 -c "
          import sys,json,base64
          d=json.load(sys.stdin)
          if 'access_token' not in d: print('TOKEN FAIL:',d.get('error'),str(d.get('error_description'))[:200]); sys.exit(0)
          p=d['access_token'].split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p)); print('TOKEN OK; roles:',c.get('roles'))
          open('/tmp/tok','w').write(d['access_token'])"
          if [ -f /tmp/tok ]; then
            echo "Mailbox probe (customersupport):"
            curl -s -o /dev/null -w "CS mailFolders HTTP %{http_code}\n" -H "Authorization: Bearer $(cat /tmp/tok)" "https://graph.microsoft.com/v1.0/users/customersupport@jit4you.com/mailFolders?\$top=1"
            curl -s -o /dev/null -w "Other mailbox (amirmalka12@gmail.com-free probe) HTTP %{http_code}\n" -H "Authorization: Bearer $(cat /tmp/tok)" "https://graph.microsoft.com/v1.0/users/$(curl -s -H "Authorization: Bearer $(cat /tmp/tok)" 'https://graph.microsoft.com/v1.0/users?$top=5&$select=userPrincipalName' | python3 -c "import sys,json;u=[x['userPrincipalName'] for x in json.load(sys.stdin).get('value',[]) if 'customersupport' not in x['userPrincipalName'].lower()];print(u[0] if u else 'none')")/mailFolders?\$top=1"
          fi
