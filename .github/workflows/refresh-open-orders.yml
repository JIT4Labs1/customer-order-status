name: Refresh Open Orders Page

# Triggered on demand by the Refresh button on the published page (via the GitHub
# API workflow_dispatch). Re-pulls fresh data from Vtiger using the SAME pipeline
# as the open-orders report, rebuilds the per-customer tabbed page + JSON snapshot,
# and commits them back so GitHub Pages serves the updated data.

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Full rebuild (ignore the saved Vtiger record store). Default: incremental.'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: refresh-open-orders
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore saved Vtiger record store (incremental mode)
        uses: actions/cache@v4
        with:
          path: retrieve_store.json
          key: retrieve-store-${{ github.run_id }}
          restore-keys: |
            retrieve-store-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate page (retry until a clean, complete Vtiger pass)
        env:
          # Vtiger credentials come from encrypted repo secrets — never committed.
          VTIGER_USER: ${{ secrets.VTIGER_USER }}
          VTIGER_ACCESS_KEY: ${{ secrets.VTIGER_ACCESS_KEY }}
          # The button token is embedded into the rebuilt page so the button keeps
          # working after each refresh. Stored as an encrypted secret.
          GH_BUTTON_TOKEN: ${{ secrets.GH_BUTTON_TOKEN }}
        run: |
          set +e
          # Guarantee a COMPLETELY FRESH pull every refresh: remove any cache so
          # no prior snapshot or cached record is reused. (CI checkouts don't carry
          # the cache anyway, but this makes it explicit and bulletproof.)
          rm -f retrieve_cache_*.json
          # INCREMENTAL by default: retrieve_store.json (restored from the Actions cache) keeps every SO/PO/delivery-note record;
          # open_orders_report.validate_store() re-fetches only those whose Vtiger modifiedtime changed, plus new ones.
          # A FULL rebuild (inputs.full=true, sent by the midnight PST run) deletes the store first. A store older than 30h is also discarded.
          export RETRIEVE_STORE=retrieve_store.json
          if [ "${{ inputs.full }}" = "true" ]; then echo 'FULL rebuild requested'; rm -f retrieve_store.json; fi
          code=1
          for i in $(seq 1 12); do
            echo "::group::Pass $i"
            python open_orders_page.py --no-push
            code=$?
            echo "::endgroup::"
            if [ $code -eq 0 ]; then
              echo "Clean pass on attempt $i"
              break
            fi
            echo "Incomplete (exit $code) — Vtiger rate-limited; cache warmed, retrying..."
            sleep 5
          done
          if [ $code -ne 0 ]; then
            echo "Failed to complete a clean Vtiger pass after retries"
            exit 1
          fi

      - name: Install poppler (pdftotext for QB invoice PDFs)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils || true

      - name: Refresh A/R and A/P data (build_payment_status.py)
        run: |
          set +e
          pip install requests >/dev/null 2>&1
          for i in 1 2 3; do
            python build_payment_status.py > _bps.log 2>&1
            code=$?
            tail -5 _bps.log
            if [ $code -eq 0 ] && python -c "import json;d=json.load(open('payment-status-data.json'));assert d.get('ar',{}).get('customers') and d.get('ap',{}).get('vendors')"; then
              echo "A/R & A/P OK on attempt $i"; break
            fi
            echo "A/R & A/P incomplete; sleeping 60s"; sleep 60
          done
          exit 0

      - name: Commit & push updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add open-orders.html open-orders-data.json payment-status-data.json _qb_invoice_pdf_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh open orders page — $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Rebase onto any commits that landed while this run was pulling, then
            # push with a few retries to avoid non-fast-forward failures.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed; retrying..."
              sleep 5
            done
          fi
